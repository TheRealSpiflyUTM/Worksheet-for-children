spring.application.name=backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/worksheets}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Application files
app.upload-directory=./data/uploads
app.count-match.image-directory=./data/Count & Mathc (MiniGame)/Images
app.minigame-asset-directory=./data/minigame-assets

# Frontend origin
app.auth.allowed-origin=http://localhost:5173
app.security.csrf-enabled=${APP_CSRF_ENABLED:true}
app.bootstrap-admin.name=${APP_BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Session cookie
server.servlet.session.cookie.name=WORKSHEET_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/api
server.servlet.session.cookie.secure=${AUTH_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
