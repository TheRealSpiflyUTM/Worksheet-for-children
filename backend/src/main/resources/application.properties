spring.application.name=backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/worksheets
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Application files
app.upload-directory=./data/uploads
app.count-match.image-directory=./data/Count & Mathc (MiniGame)/Images

# Frontend origin
app.auth.allowed-origin=http://localhost:5173

# Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Session cookie
server.servlet.session.cookie.name=WORKSHEET_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/api
server.servlet.session.cookie.secure=${AUTH_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie