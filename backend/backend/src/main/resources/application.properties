spring.application.name=backend
spring.datasource.url=jdbc:h2:file:./data/database/worksheet
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

app.upload-directory=./data/uploads
app.count-match.image-directory=./data/Count & Mathc (MiniGame)/Images

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Authentication has its own database; the minigame datasource above is unchanged.
app.auth.database-url=jdbc:h2:file:./data/auth/users
server.servlet.session.cookie.name=WORKSHEET_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/api/auth
server.servlet.session.cookie.secure=${AUTH_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
