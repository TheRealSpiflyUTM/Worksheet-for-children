spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/worksheets
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update

app.upload-directory=./data/uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.servlet.session.cookie.name=WORKSHEET_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/api/auth
server.servlet.session.cookie.secure=${AUTH_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
